<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Laberinto de cristal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app — header strip, glass board filling the middle, control strip below */
:root{
  --bg:#e9eeef; --fg:#1b2326; --muted:#5b686d; --board:#f8fafa; --board-edge:#cfd9db;
  --glass:rgba(150,178,184,.42); --glass-edge:rgba(84,116,122,.7); --shadow:rgba(28,48,54,.16);
  --hole:#172024; --accent:#2c6c70; --btn:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101517; --fg:#e4ebed; --muted:#8fa0a5; --board:#192124; --board-edge:#2c383c;
  --glass:rgba(150,200,206,.16); --glass-edge:rgba(160,206,212,.5); --shadow:rgba(0,0,0,.45);
  --hole:#030607; --accent:#7cc3c5; --btn:#1f292c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101517; --fg:#e4ebed; --muted:#8fa0a5; --board:#192124; --board-edge:#2c383c;
  --glass:rgba(150,200,206,.16); --glass-edge:rgba(160,206,212,.5); --shadow:rgba(0,0,0,.45);
  --hole:#030607; --accent:#7cc3c5; --btn:#1f292c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);display:flex;flex-direction:column;gap:10px;
  box-sizing:border-box;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.hud{display:flex;gap:14px;font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--fg);font-weight:500}
#stage{flex:1;min-height:0;display:grid;place-items:center}
canvas{display:block;touch-action:none;max-width:100%}
footer{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 .95rem var(--display);color:var(--fg);background:var(--btn);border:1px solid var(--board-edge);
  border-radius:10px;padding:10px 14px;cursor:pointer;flex:1;min-width:0}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{margin:0;font-size:.85rem;color:var(--muted);min-height:1.2em}
</style>

<header>
  <h1>Laberinto de cristal</h1>
  <div class="hud"><span>Nivel <b id="lvl">1</b></span><span><b id="time">0.0</b> s</span><span>Récord <b id="best">—</b></span></div>
</header>
<div id="stage"><canvas id="board" aria-label="Tablero del laberinto"></canvas></div>
<footer>
  <div class="row">
    <button id="tilt" class="primary">Activar inclinación</button>
    <button id="calib">Calibrar</button>
    <button id="regen">Otro laberinto</button>
  </div>
  <p id="status">Inclina el móvil y lleva la bola al agujero con anillo. Desde el nivel 2, evita los agujeros trampa.</p>
</footer>

<script>
(()=>{
const cv=document.getElementById('board'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $lvl=document.getElementById('lvl'),$time=document.getElementById('time'),$status=document.getElementById('status');
const T=0.17,R=0.27,E=0.35,G=22,MARGIN=0.38;
const $best=document.getElementById('best');
let best={};try{best=JSON.parse(localStorage.getItem('laberinto.best')||'{}')}catch(e){}
function showBest(){const b=best[level];$best.textContent=b?b.toFixed(1)+' s':'—'}
function buzz(ms){try{if(window.AndroidHaptics)AndroidHaptics.vibrate(ms|0);else if(navigator.vibrate)navigator.vibrate(ms|0)}catch(e){}}
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=performance.now();else if(hiddenAt){t0+=performance.now()-hiddenAt;hiddenAt=0;last=performance.now()}});
let traps=[],target=null,cols,rows,segs=[],ball,hole,level=1,t0=performance.now(),state='play',fallT=0,scale=1,ox=0,oy=0,colors={};
let tilt={x:0,y:0},sensorOn=false,lastOri=null,neutral=null,drag=null,keys={};

function readColors(){const s=getComputedStyle(document.documentElement);
  for(const k of['board','board-edge','glass','glass-edge','shadow','hole','accent'])colors[k]=s.getPropertyValue('--'+k).trim();}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function gen(){
  const aw=stage.clientWidth||300,ah=stage.clientHeight||400,base=Math.min(3+level,14);
  if(aw<=ah){cols=base;rows=Math.min(22,Math.max(base,Math.round(base*ah/aw)));}
  else{rows=base;cols=Math.min(22,Math.max(base,Math.round(base*aw/ah)));}
  const N=cols*rows,id=(x,y)=>y*cols+x,right=new Uint8Array(N).fill(1),down=new Uint8Array(N).fill(1),vis=new Uint8Array(N);
  const st=[[0,0]];vis[0]=1;
  while(st.length){const[x,y]=st[st.length-1];const n=[];
    if(x>0&&!vis[id(x-1,y)])n.push([x-1,y]);if(x<cols-1&&!vis[id(x+1,y)])n.push([x+1,y]);
    if(y>0&&!vis[id(x,y-1)])n.push([x,y-1]);if(y<rows-1&&!vis[id(x,y+1)])n.push([x,y+1]);
    if(!n.length){st.pop();continue}
    const[nx,ny]=n[Math.random()*n.length|0];
    if(nx>x)right[id(x,y)]=0;else if(nx<x)right[id(nx,ny)]=0;else if(ny>y)down[id(x,y)]=0;else down[id(nx,ny)]=0;
    vis[id(nx,ny)]=1;st.push([nx,ny]);}
  // a few extra openings so it feels like the glass toy, not a pure tree
  for(let i=0;i<N*0.06;i++){const x=Math.random()*cols|0,y=Math.random()*rows|0;
    if(Math.random()<.5&&x<cols-1)right[id(x,y)]=0;else if(y<rows-1)down[id(x,y)]=0;}
  segs=[];
  for(let y=1;y<rows;y++){let s=-1;for(let x=0;x<=cols;x++){const w=x<cols&&down[id(x,y-1)];
    if(w&&s<0)s=x;if(!w&&s>=0){segs.push({ax:s,ay:y,bx:x,by:y});s=-1}}}
  for(let x=1;x<cols;x++){let s=-1;for(let y=0;y<=rows;y++){const w=y<rows&&right[id(x-1,y)];
    if(w&&s<0)s=y;if(!w&&s>=0){segs.push({ax:x,ay:s,bx:x,by:y});s=-1}}}
  segs.push({ax:0,ay:0,bx:cols,by:0},{ax:cols,ay:0,bx:cols,by:rows},{ax:cols,ay:rows,bx:0,by:rows},{ax:0,ay:rows,bx:0,by:0});
  // shortest route start→goal, so trap holes never block it
  const prev=new Int32Array(N).fill(-1),q=[0];prev[0]=0;
  while(q.length){const c=q.shift(),x=c%cols,y=c/cols|0;
    const nb=[];if(x<cols-1&&!right[c])nb.push(c+1);if(x>0&&!right[c-1])nb.push(c-1);
    if(y<rows-1&&!down[c])nb.push(c+cols);if(y>0&&!down[c-cols])nb.push(c-cols);
    for(const n of nb)if(prev[n]<0){prev[n]=c;q.push(n)}}
  const onPath=new Uint8Array(N);for(let c=N-1;;c=prev[c]){onPath[c]=1;if(c===0)break}
  const free=[];for(let c=0;c<N;c++){const x=c%cols,y=c/cols|0;if(!onPath[c]&&x+y>2)free.push(c)}
  traps=[];const nT=level<2?0:Math.min(free.length,12,Math.floor((level-1)*1.3));
  for(let i=0;i<nT;i++){const c=free.splice(Math.random()*free.length|0,1)[0];traps.push({x:c%cols+.5,y:(c/cols|0)+.5})}
  ball={x:.5,y:.5,vx:0,vy:0,s:1};hole={x:cols-.5,y:rows-.5};state='play';t0=performance.now();
  $lvl.textContent=level;showBest();layout();
}
function layout(){
  const aw=stage.clientWidth,ah=stage.clientHeight,dpr=window.devicePixelRatio||1;
  scale=Math.max(4,Math.min(aw/(cols+2*MARGIN),ah/(rows+2*MARGIN)));
  const w=scale*(cols+2*MARGIN),h=scale*(rows+2*MARGIN);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);ox=oy=MARGIN*scale;
}
addEventListener('resize',()=>{if(cols)layout()});

function collide(){let hit=0;const rr=R+T/2;
  for(const s of segs){const dx=s.bx-s.ax,dy=s.by-s.ay,L=dx*dx+dy*dy;
    let u=((ball.x-s.ax)*dx+(ball.y-s.ay)*dy)/L;u=u<0?0:u>1?1:u;
    const px=s.ax+u*dx,py=s.ay+u*dy;let nx=ball.x-px,ny=ball.y-py;const d=Math.hypot(nx,ny);
    if(d<rr&&d>1e-6){nx/=d;ny/=d;ball.x=px+nx*rr;ball.y=py+ny*rr;const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=(1+E)*vn*nx;ball.vy-=(1+E)*vn*ny;hit=Math.max(hit,-vn)}}}
  return hit;}

function input(){
  if(drag)return drag.t;
  const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(kx||ky)return{x:kx*.7,y:ky*.7};
  return sensorOn?tilt:{x:0,y:0};
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){
    const a=input();ball.vx+=a.x*G*dt;ball.vy+=a.y*G*dt;
    const dh=Math.hypot(hole.x-ball.x,hole.y-ball.y);
    if(dh<.45){ball.vx+=(hole.x-ball.x)*30*dt;ball.vy+=(hole.y-ball.y)*30*dt}
    const damp=Math.exp(-.9*dt);ball.vx*=damp;ball.vy*=damp;
    const sp=Math.hypot(ball.vx,ball.vy);if(sp>14){ball.vx*=14/sp;ball.vy*=14/sp}
    const n=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/.06));let hit=0;
    for(let i=0;i<n;i++){ball.x+=ball.vx*dt/n;ball.y+=ball.vy*dt/n;hit=Math.max(hit,collide())}
    if(hit>4)buzz(Math.min(30,hit*2));
    for(const t of traps){const d=Math.hypot(t.x-ball.x,t.y-ball.y);
      if(d<.42){ball.vx+=(t.x-ball.x)*22*dt;ball.vy+=(t.y-ball.y)*22*dt}
      if(d<.2){state='trap';fallT=0;target=t;buzz(120);$status.textContent='¡Al agujero! Vuelves a la salida. El tiempo sigue corriendo.';break}}
    if(state==='play'&&Math.hypot(hole.x-ball.x,hole.y-ball.y)<.2){state='fall';fallT=0;target=hole;buzz(60);
      const t=(now-t0)/1000,prevB=best[level];
      if(!prevB||t<prevB){best[level]=t;try{localStorage.setItem('laberinto.best',JSON.stringify(best))}catch(e){}}
      $status.textContent=!prevB?`Nivel ${level} superado en ${t.toFixed(1)} s.`:t<prevB?`¡Nuevo récord en el nivel ${level}: ${t.toFixed(1)} s!`:`Nivel ${level} en ${t.toFixed(1)} s. Récord: ${prevB.toFixed(1)} s.`;}
    $time.textContent=((now-t0)/1000).toFixed(1);
  }else{
    fallT+=dt;ball.x+=(target.x-ball.x)*.2;ball.y+=(target.y-ball.y)*.2;ball.s=Math.max(0,1-fallT/.5);
    if(fallT>.9){if(state==='fall'){level++;gen()}else{ball={x:.5,y:.5,vx:0,vy:0,s:1};state='play'}}
    $time.textContent=((now-t0)/1000).toFixed(1);
  }
  draw();requestAnimationFrame(frame);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function strokeSegs(dx,dy,w,col){ctx.lineCap='round';ctx.lineWidth=w;ctx.strokeStyle=col;ctx.beginPath();
  for(const s of segs){ctx.moveTo(ox+(s.ax+dx)*scale,oy+(s.ay+dy)*scale);ctx.lineTo(ox+(s.bx+dx)*scale,oy+(s.by+dy)*scale)}ctx.stroke()}
function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);
  rr(1,1,w-2,h-2,scale*.45);ctx.fillStyle=colors.board;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=colors['board-edge'];ctx.stroke();
  // hole
  const hx=ox+hole.x*scale,hy=oy+hole.y*scale,hr=scale*.34;
  const hg=ctx.createRadialGradient(hx,hy-hr*.3,hr*.1,hx,hy,hr);hg.addColorStop(0,colors.hole);hg.addColorStop(1,colors.hole);
  ctx.beginPath();ctx.arc(hx,hy,hr,0,7);ctx.fillStyle=hg;ctx.fill();ctx.lineWidth=Math.max(2,scale*.07);ctx.strokeStyle=colors.accent;ctx.stroke();
  for(const t of traps){const x=ox+t.x*scale,y=oy+t.y*scale,r=scale*.3;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=colors.hole;ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle=colors['glass-edge'];ctx.stroke();
    ctx.beginPath();ctx.arc(x,y+r*.15,r*.75,Math.PI*1.15,Math.PI*1.85);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.stroke();}
  // glass walls: drop shadow, edge, body, highlight
  const tw=T*scale;
  strokeSegs(.05,.08,tw,colors.shadow);
  strokeSegs(0,0,tw,colors['glass-edge']);
  strokeSegs(0,0,Math.max(1,tw-3),colors.glass);
  strokeSegs(-.02,-.025,Math.max(1,tw*.22),'rgba(255,255,255,.55)');
  // ball
  if(ball.s>0){const bx=ox+ball.x*scale,by=oy+ball.y*scale,r=R*scale*ball.s;
    ctx.beginPath();ctx.ellipse(bx+r*.25,by+r*.35,r,r*.9,0,0,7);ctx.fillStyle=colors.shadow;ctx.fill();
    const g=ctx.createRadialGradient(bx-r*.35,by-r*.4,r*.05,bx,by,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(.25,'#d5dcdf');g.addColorStop(.7,'#7d888d');g.addColorStop(1,'#2f383c');
    ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle='rgba(20,28,32,.6)';ctx.stroke();}
}

// --- tilt sensor ---
function screenAngle(){return(screen.orientation&&screen.orientation.angle)||window.orientation||0}
function onOri(e){if(e.beta==null||e.gamma==null)return;lastOri={b:e.beta,g:e.gamma};
  if(!neutral){neutral={...lastOri};}
  if(!sensorOn){sensorOn=true;$status.textContent='Inclinación activa. Inclina el móvil para mover la bola.'}
  const g=e.gamma-neutral.g,b=e.beta-neutral.b,a=((screenAngle()%360)+360)%360;
  let x=g,y=b;if(a===90){x=b;y=-g}else if(a===270){x=-b;y=g}else if(a===180){x=-g;y=-b}
  const c=v=>Math.max(-1,Math.min(1,v/30));tilt={x:c(x),y:c(y)};}
const needsPerm=!!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function');
function startSensor(){neutral=null;addEventListener('deviceorientation',onOri);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  setTimeout(()=>{if(!sensorOn)$status.textContent='No llega señal del sensor de inclinación. Arrastra el dedo sobre el tablero o usa las flechas.'},1500);}
const $tiltBtn=document.getElementById('tilt');
if(needsPerm){$tiltBtn.onclick=async()=>{
  try{const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){$status.textContent='Permiso de movimiento denegado. Usa el dedo sobre el tablero.';return}}catch(e){}
  $tiltBtn.hidden=true;startSensor();};}
else{$tiltBtn.hidden=true;startSensor();}
document.getElementById('calib').onclick=()=>{if(lastOri){neutral={...lastOri};$status.textContent='Calibrado: esta posición es «plano».'}else $status.textContent='Activa primero la inclinación.'};
document.getElementById('regen').onclick=()=>gen();

// --- finger / keyboard fallback ---
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,t:{x:0,y:0}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const c=v=>Math.max(-1,Math.min(1,v/70));drag.t={x:c(e.clientX-drag.x),y:c(e.clientY-drag.y)}});
const up=()=>drag=null;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=1;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key]=0});

readColors();
requestAnimationFrame(()=>{gen();requestAnimationFrame(frame)});
})();
</script>

</html>
